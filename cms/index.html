<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alif Group | Tiny CMS</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --sub: #94a3b8;
      --primary: #2563eb;
      --success: #10b981;
      --error: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 40px 20px; display: flex; justify-content: center; }
    .cms-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 30px; max-width: 600px; width: 100%; }
    h1 { font-size: 1.8rem; margin-bottom: 20px; color: #38bdf8; text-align: center; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.9rem; color: var(--sub); margin-bottom: 6px; font-weight: 600; }
    input, textarea { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.95rem; }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); }
    textarea { resize: vertical; height: 80px; }
    .btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
    .btn:hover { opacity: 0.9; }
    #status { margin-top: 15px; text-align: center; font-weight: 600; font-size: 0.9rem; padding: 10px; border-radius: 6px; display: none; }
    .status-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .status-error { background: rgba(239, 68, 68, 0.2); color: var(--error); }
  </style>
</head>
<body>

  <div class="cms-card">
    <h1>Alif CMS Admin</h1>

    <div class="form-group">
      <label for="gh-token">GitHub Fine-Grained Personal Access Token</label>
      <input type="password" id="gh-token" placeholder="github_pat_11A...">
    </div>

    <hr style="border-color: var(--border); margin: 20px 0;">

    <div class="form-group">
      <label for="siteTitle">Site Title</label>
      <input type="text" id="siteTitle" placeholder="Alif Group Portal">
    </div>

    <div class="form-group">
      <label for="siteTagline">Site Tagline</label>
      <input type="text" id="siteTagline" placeholder="Connecting Business Excellence & Digital Innovation">
    </div>

    <div class="form-group">
      <label for="corpDesc">Alif Corporation Description</label>
      <textarea id="corpDesc" placeholder="Official B2B, B2G supply portal..."></textarea>
    </div>

    <div class="form-group">
      <label for="netDesc">Alif Network Description</label>
      <textarea id="netDesc" placeholder="Web development and IT services..."></textarea>
    </div>

    <button class="btn" onclick="saveData()">Save & Publish to alif.name</button>

    <div id="status"></div>
  </div>

  <script>
  const owner = "alifcorporation";
  const repo = "alif.github.io";
  const path = "data.json";

  const tokenInput = document.getElementById("gh-token");

  // Load saved token
  const savedToken = localStorage.getItem("gh_pat");
  if (savedToken) {
    tokenInput.value = savedToken;
  }

  // Load existing data.json
  fetch("/data.json?v=" + Date.now())
    .then(res => {
      if (!res.ok) throw new Error("data.json not found");
      return res.json();
    })
    .then(data => {
      if (data.siteTitle)
        document.getElementById("siteTitle").value = data.siteTitle;

      if (data.siteTagline)
        document.getElementById("siteTagline").value = data.siteTagline;

      if (data.corpDesc)
        document.getElementById("corpDesc").value = data.corpDesc;

      if (data.netDesc)
        document.getElementById("netDesc").value = data.netDesc;
    })
    .catch(err => {
      console.log("Could not load data.json:", err.message);
    });

  async function saveData() {

    const token = tokenInput.value.trim();
    const statusDiv = document.getElementById("status");

    statusDiv.style.display = "block";
    statusDiv.className = "";
    statusDiv.innerText = "Publishing updates to GitHub...";

    if (!token) {
      statusDiv.className = "status-error";
      statusDiv.innerText = "Error: Please enter your GitHub Personal Access Token!";
      return;
    }

    localStorage.setItem("gh_pat", token);

    const content = {
      siteTitle: document.getElementById("siteTitle").value,
      siteTagline: document.getElementById("siteTagline").value,
      corpDesc: document.getElementById("corpDesc").value,
      netDesc: document.getElementById("netDesc").value
    };

    const getUrl =
      `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

    try {

      // Get current file SHA
      const getRes = await fetch(getUrl, {
        method: "GET",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28"
        }
      });

      let sha = "";

      if (getRes.ok) {
        const getData = await getRes.json();
        sha = getData.sha;
      } else if (getRes.status !== 404) {
        const errorData = await getRes.json().catch(() => ({}));
        throw new Error(
          errorData.message || `GitHub GET error: ${getRes.status}`
        );
      }

      // Convert JSON to Base64
      const jsonText = JSON.stringify(content, null, 2);

      const utf8Bytes = new TextEncoder().encode(jsonText);

      let binary = "";
      for (const byte of utf8Bytes) {
        binary += String.fromCharCode(byte);
      }

      const base64Content = btoa(binary);

      // Create/update data.json
      const body = {
        message: "Update site configuration via Tiny CMS",
        content: base64Content
      };

      if (sha) {
        body.sha = sha;
      }

      const putRes = await fetch(getUrl, {
        method: "PUT",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json",
          "X-GitHub-Api-Version": "2022-11-28"
        },
        body: JSON.stringify(body)
      });

      const result = await putRes.json();

      if (!putRes.ok) {
        throw new Error(
          result.message || `GitHub PUT error: ${putRes.status}`
        );
      }

      statusDiv.className = "status-success";
      statusDiv.innerText =
        "✔ Successfully published to GitHub.";

    } catch (err) {

      statusDiv.className = "status-error";
      statusDiv.innerText = "Failed: " + err.message;

      console.error("GitHub API error:", err);
    }
  }
</script>
</body>
</html>
